<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#6abe30" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>Farma</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #cbdbfc; }
      #game, #ui { position: absolute; inset: 0; }
      #ui { pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui"></div>
    <script>
      // iOS Safari: block pinch-zoom gestures (double-tap zoom is off via touch-action: manipulation)
      for (const t of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(t, (e) => e.preventDefault());
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
